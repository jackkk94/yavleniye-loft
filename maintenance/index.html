<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>Лофт Явление</title>
	<link rel="icon" href="/assets/favicon.ico" sizes="any">
	<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
	<style>
		@font-face {
			font-family: LTWave;
			font-weight: 300;
			src: url("/assets/fonts/LTWave-Light.otf") format("opentype");
		}

		* {
			margin: 0;
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: #231f1f;
			color: #fff;
			font-family: LTWave, Arial, sans-serif;
			font-weight: 300;
			text-align: center;
		}

		h1 {
			margin-bottom: 24px;
			color: #d4c6a5;
			font-size: clamp(36px, 8vw, 72px);
			font-weight: 300;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		p {
			font-size: clamp(16px, 3vw, 22px);
			line-height: 1.5;
			opacity: 0.8;
		}
	</style>
</head>

<body>
	<main>
		<h1>Лофт Явление</h1>
		<p>Сайт скоро откроется</p>
	</main>
</body>

</html>
